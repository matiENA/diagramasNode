<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filtros Operativos - Componente Figma / Web EOR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Roboto+Mono:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'Roboto Mono', monospace;
      --primary: #19407e;
      --primary-hover: #133365;
      --primary-light: #eef4ff;
      --accent: #4f46e5;
      --accent-light: #e0e7ff;
      --bg-app: #f1f5f9;
      --bg-surface: #ffffff;
      --bg-surface-muted: #f8fafc;
      --border-subtle: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-main: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);

      /* Novedades EOR */
      --novedad-f-bg: #eff6ff;
      --novedad-f-text: #1d4ed8;
      --novedad-f-border: #bfdbfe;

      --novedad-e-bg: #ffe4e6;
      --novedad-e-text: #9f1239;
      --novedad-e-border: #fecdd3;

      --novedad-v-bg: #ecfdf5;
      --novedad-v-text: #065f46;
      --novedad-v-border: #a7f3d0;

      --novedad-act-bg: #f0fdf4;
      --novedad-act-text: #166534;
      --novedad-act-border: #bbf7d0;

      --novedad-s-bg: #fff7ed;
      --novedad-s-text: #9a3412;
      --novedad-s-border: #fed7aa;

      --novedad-a-bg: #fef2f2;
      --novedad-a-text: #991b1b;
      --novedad-a-border: #fecaca;

      --novedad-art-bg: #f5f3ff;
      --novedad-art-text: #5b21b6;
      --novedad-art-border: #ddd6fe;

      --novedad-ind-bg: #f1f5f9;
      --novedad-ind-text: #334155;
      --novedad-ind-border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-app);
      color: var(--text-main);
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    /* CONTENEDOR EXACTO DEL SIDEBAR */
    .filters-column {
      width: 310px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .filters-content {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* CABECERA */
    .filters-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 0.75rem;
    }

    .filters-heading {
      font-size: 0.92rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-clear-filters {
      font-size: 0.75rem;
      color: var(--primary);
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
    }

    /* BUSCADOR */
    .filter-search-box {
      position: relative;
      width: 100%;
    }

    .filter-search-input {
      width: 100%;
      padding: 0.55rem 0.75rem 0.55rem 2.2rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-surface-muted);
      font-size: 0.82rem;
      outline: none;
      color: var(--text-main);
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .filter-search-input::placeholder {
      color: var(--text-muted);
    }

    .filter-search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    /* SECCIONES Y LABELS */
    .filter-section {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 1rem;
    }

    .filter-section:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .filter-label {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    /* BOTONES Y CHIPS */
    .filter-chip-btn {
      padding: 0.45rem 0.75rem;
      border-radius: var(--radius-sm);
      background-color: var(--bg-surface-muted);
      border: 1px solid var(--border-subtle);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      text-align: left;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    .filter-chip-btn.active {
      background-color: var(--primary) !important;
      border-color: var(--primary) !important;
      color: #ffffff !important;
      font-weight: 800;
    }

    .btn-retorno {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.85rem;
      font-weight: 800;
      font-size: 0.8rem;
      background-color: #eef2ff;
      color: #3730a3;
      border: 1px solid #c7d2fe;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: 0.15s;
    }

    /* GRILLA 5x2 DE ESTADOS DEL DÍA */
    .filter-states-grid-5x2 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.35rem;
      width: 100%;
    }

    .filter-state-chip {
      aspect-ratio: 1.2 / 1;
      min-height: 33px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm, 6px);
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-surface-muted);
      color: var(--text-secondary);
      font-family: var(--font-mono, monospace);
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      padding: 0;
    }

    .filter-state-chip:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
      border-color: var(--border-strong);
    }

    .filter-state-chip.active {
      box-shadow: 0 0 0 2px var(--primary);
      transform: scale(1.04);
      font-weight: 900;
    }

    /* Colores EOR para Chips */
    .filter-state-chip.chip-F { background-color: var(--novedad-f-bg); color: var(--novedad-f-text); border-color: var(--novedad-f-border); }
    .filter-state-chip.chip-FSF { background-color: var(--novedad-f-bg); color: var(--novedad-f-text); border: 1.5px dashed var(--novedad-f-border); }
    .filter-state-chip.chip-V { background-color: var(--novedad-v-bg); color: var(--novedad-v-text); border-color: var(--novedad-v-border); }
    .filter-state-chip.chip-VSF { background-color: var(--novedad-v-bg); color: var(--novedad-v-text); border: 1.5px dashed var(--novedad-v-border); }
    .filter-state-chip.chip-ACT { background-color: var(--novedad-act-bg); color: var(--novedad-act-text); border-color: var(--novedad-act-border); }

    .filter-state-chip.chip-E { background-color: var(--novedad-e-bg); color: var(--novedad-e-text); border-color: var(--novedad-e-border); }
    .filter-state-chip.chip-ART { background-color: var(--novedad-art-bg); color: var(--novedad-art-text); border-color: var(--novedad-art-border); }
    .filter-state-chip.chip-IND { background-color: var(--novedad-ind-bg); color: var(--novedad-ind-text); border-color: var(--novedad-ind-border); }
    .filter-state-chip.chip-S { background-color: var(--novedad-s-bg); color: var(--novedad-s-text); border-color: var(--novedad-s-border); }
    .filter-state-chip.chip-A { background-color: var(--novedad-a-bg); color: var(--novedad-a-text); border-color: var(--novedad-a-border); }

    /* CHIPS DE SERVICIO */
    .filter-chips-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .filter-chips-grid .filter-chip-btn {
      text-align: center;
      justify-content: center;
      padding: 0.35rem 0.7rem;
    }
  </style>
</head>
<body>

  <aside class="filters-column desktop-only">
    <div class="filters-content">
      
      <!-- 1. Cabecera -->
      <div class="filters-header">
        <h3 class="filters-heading">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-funnel" aria-hidden="true">
            <path d="M10 20a1 1 0 0 0 .553.895l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .517-1.341L21.74 4.67A1 1 0 0 0 21 3H3a1 1 0 0 0-.742 1.67l7.225 7.989A2 2 0 0 1 10 14z"></path>
          </svg>
          <span>Filtros Operativos</span>
        </h3>
        <button class="btn-clear-filters" title="Restablecer todos los filtros">Limpiar</button>
      </div>

      <!-- 2. Buscador -->
      <div class="filter-search-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search filter-search-icon" aria-hidden="true">
          <path d="m21 21-4.34-4.34"></path>
          <circle cx="11" cy="11" r="8"></circle>
        </svg>
        <input class="filter-search-input" placeholder="Buscar chofer, tractor, semi, UTE..." type="text" value="">
      </div>

      <!-- 3. Personal que Retorna -->
      <div class="filter-section">
        <button type="button" class="btn-retorno" title="Mostrar únicamente choferes con retorno programado o que retornan hoy">
          <span style="display: flex; align-items: center; gap: 0.4rem;">
            <span>🔄</span>
            <span>Personal que Retorna</span>
          </span>
        </button>
      </div>

      <!-- 4. Estado del Día (Grilla 5x2) -->
      <div class="filter-section">
        <span class="filter-label">Estado del Día</span>
        <div style="display: flex; flex-direction: column; gap: 0.45rem;">
          <button class="filter-chip-btn active" style="width: 100%;">Todos los estados</button>
          
          <div class="filter-states-grid-5x2">
            <!-- Fila 1: Descansos y Trabajo -->
            <button class="filter-state-chip chip-F" title="Franco (F)">F</button>
            <button class="filter-state-chip chip-FSF" title="Franco Sin Franco (FSF)">FSF</button>
            <button class="filter-state-chip chip-V" title="Vacaciones (V)">V</button>
            <button class="filter-state-chip chip-VSF" title="Vacaciones Sin Franco (VSF)">VSF</button>
            <button class="filter-state-chip chip-ACT" title="Activos (Trabajando)">ACT</button>

            <!-- Fila 2: Novedades / Ausencias -->
            <button class="filter-state-chip chip-E" title="Enfermedad (E)">E</button>
            <button class="filter-state-chip chip-ART" title="Accidente Laboral (ART)">ART</button>
            <button class="filter-state-chip chip-IND" title="Indispuesto (IND)">IND</button>
            <button class="filter-state-chip chip-S" title="Suspensión (S)">S</button>
            <button class="filter-state-chip chip-A" title="Ausente (A)">A</button>
          </div>
        </div>
      </div>

      <!-- 5. Alertas de Vencimiento -->
      <div class="filter-section">
        <span class="filter-label">Alertas de Vencimiento</span>
        <div style="display: flex; flex-direction: column; gap: 0.35rem;">
          <button class="filter-chip-btn active">Sin filtro de alerta</button>
          <button class="filter-chip-btn">🔴 Documentación Chofer Vencida</button>
          <button class="filter-chip-btn">🚚 Unidad (VTV/MASS) Vencida</button>
          <button class="filter-chip-btn">⚠️ Cualquier Alerta Activa</button>
        </div>
      </div>

      <!-- 6. Servicio (con GRALES.) -->
      <div class="filter-section">
        <span class="filter-label">Servicio</span>
        <div class="filter-chips-grid">
          <button class="filter-chip-btn active">TODOS</button>
          <button class="filter-chip-btn">METANOL</button>
          <button class="filter-chip-btn">LIVIANO</button>
          <button class="filter-chip-btn">CAMPO</button>
          <button class="filter-chip-btn">GLP</button>
          <button class="filter-chip-btn">YPF</button>
          <button class="filter-chip-btn">GRALES.</button>
        </div>
      </div>

    </div>
  </aside>

</body>
</html>
