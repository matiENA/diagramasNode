# ==============================================================
# Blueprint Render - EOR
#   1. eor-backend   (Web Service, plan free)  -> apps/backend
#   2. eor-frontend  (Static Site)             -> apps/frontend
# ==============================================================
services:
  - type: web
    name: eor-backend
    runtime: node
    plan: free
    rootDir: apps/backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PG_MAX_CONNECTIONS
        value: 5
      - key: PG_IDLE_TIMEOUT
        value: 10000
      - key: KM_RAM_DIAS
        value: 60
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: ID_SPREADSHEET_MASTER
        sync: false
      - key: SPREADSHEET_ID
        sync: false
      - key: ID_SHEET_MOVIMIENTOS
        sync: false
      - key: MES_MOVIMIENTOS_ID
        sync: false
      - key: ID_SPREADSHEET_DIAGRAMAS
        sync: false
      - key: SHEET_KM_ID
        sync: false
      - key: ID_SHEET_KILOMETROS
        sync: false
      - key: IMGBB_API_KEY
        sync: false

  - type: static
    name: eor-frontend
    rootDir: apps/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        value: https://eor-backend.onrender.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_KEY
        sync: false
