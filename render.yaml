# ==============================================================
# Blueprint para Render — Monorepo Multi-Servicio
# 1. Backend Principal (Diagramas, Bot, Sincronización DB_CHOFERES, Dash)
# 2. Microservicio Exclusivo de Extracción de Kilómetros (km-service)
# ==============================================================

services:
  # ------------------------------------------------------------
  # 1. Backend Principal: diagramasnode
  # ------------------------------------------------------------
  - type: web
    name: diagramasnode
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: KM_SERVICE_URL
        value: https://km-extractor-service.onrender.com
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: IMGBB_API_KEY
        sync: false
      - key: SPREADSHEET_ID
        value: 1eQ9Y5diL5fwxYTxvseNgZJFbX-lSUQ13axbp3cLiqPc
      - key: MES_MOVIMIENTOS_ID
        value: 1Bwj8WCykMn_FbZhQ_FqnDH3K_WCod52YTSvsaxIDNS8
      - key: SHEET_KM_ID
        value: 1Wr-_P4mDvldif_cAx08sp7yT8uTUrajI2HQAJF6tnGM

  # ------------------------------------------------------------
  # 2. Microservicio Aislado: km-extractor-service
  # ------------------------------------------------------------
  - type: web
    name: km-extractor-service
    env: node
    plan: free
    rootDir: km-service
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: SHEET_KM_ID
        value: 1Wr-_P4mDvldif_cAx08sp7yT8uTUrajI2HQAJF6tnGM
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: POLL_INTERVAL_MINUTES
        value: 15
      - key: MAIN_BACKEND_URL
        value: https://diagramasnode.onrender.com
