# ==============================================================
# Blueprint Render - EOR
#   1. eor-backend   (Web Service, plan free)  -> apps/backend
#   2. eor           (Static Site)             -> apps/frontend
# ==============================================================
services:
  - type: web
    name: eor-backend
    runtime: node
    plan: free
    rootDir: apps/backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PG_MAX_CONNECTIONS
        value: 5
      - key: PG_IDLE_TIMEOUT
        value: 10000
      - key: KM_RAM_DIAS
        value: 60
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: SPREADSHEET_ID
        sync: false
      - key: MES_MOVIMIENTOS_ID
        value: 14Mb5rD853zxDkaLDS-IrW-OBDTDBjuJxn_3olXeWlkc
      - key: SHEET_KM_ID
        value: 1Wr-_P4mDvldif_cAx08sp7yT8uTUrajI2HQAJF6tnGM
      - key: IMGBB_API_KEY
        value: 30fdf7e82033aa1ef21be9c7e2811049

  - type: web
    name: eor
    runtime: static
    rootDir: apps/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        value: https://eor-backend.onrender.com
      - key: VITE_SUPABASE_URL
        value: https://rsvajuxihvmpmrmlcbul.supabase.co
      - key: VITE_SUPABASE_KEY
        value: sb_publishable_n97mVkSclRpuv_OsseO3gg_BjR9QT3R
